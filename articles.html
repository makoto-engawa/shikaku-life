<link rel="stylesheet" href="styles.css">
<style>
  .listing-hero {
    padding: 56px 0 28px;
  }
  .listing-hero h1 { font-size: 40px; line-height: 1.45; margin: 14px 0 12px; }
  .listing-hero p { color: var(--soft); margin: 0; max-width: 640px; line-height: 1.9; }
  @media (max-width: 720px) { .listing-hero h1 { font-size: 30px; } }

  .filter-bar {
    background: #fff;
    border: 1.5px solid var(--rule);
    border-radius: var(--radius-lg);
    padding: 18px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .filter-bar .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-bar .count {
    margin-left: auto;
    font-family: var(--font-heading);
    font-size: 13px;
    color: var(--soft);
  }
  .filter-bar .count strong { color: var(--ink-strong); }

  .sort-row {
    display: flex; align-items: center; gap: 10px;
    margin: 0 0 24px;
    font-family: var(--font-heading);
    font-size: 13px;
    color: var(--soft);
  }
  .sort-row .pill {
    background: #fff;
    border: 1.5px solid var(--rule);
    border-radius: 999px;
    padding: 6px 14px;
    color: var(--ink);
    cursor: pointer;
  }
  .sort-row .pill.is-active {
    background: var(--ink-strong);
    color: #fff;
    border-color: var(--ink-strong);
  }

  /* Pagination */
  .pager {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 48px;
  }
  .pager a, .pager span {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border-radius: 12px;
    border: 1.5px solid var(--rule);
    background: #fff;
    font-family: var(--font-heading);
    font-weight: 700;
    color: var(--ink);
  }
  .pager a:hover { background: var(--primary-soft); color: var(--primary-deep); text-decoration: none; border-color: var(--primary); }
  .pager .is-current { background: var(--ink-strong); color: #fff; border-color: var(--ink-strong); }
  .pager .nav { width: auto; padding: 0 18px; }
</style>

<body data-screen-label="02 Articles">

<div id="header-slot"></div>

<section class="listing-hero">
  <div class="container">
    <span class="eyebrow">ARTICLES</span>
    <h1>記事一覧</h1>
    <p>カテゴリで絞り込んだり、キーワードで探したり。<em>あなたの「次の一資格」</em>を見つけてください。</p>
  </div>
</section>

<section style="padding: 8px 0 80px;">
  <div class="container">

    <div class="filter-bar">
      <div class="chips" id="chips">
        <button class="chip is-active" data-cat="all">すべて</button>
        <button class="chip" data-cat="bilmen">🔧 ビルメン系</button>
        <button class="chip" data-cat="ai">🤖 IT・AI</button>
        <button class="chip" data-cat="law">⚖️ 法律系</button>
        <button class="chip" data-cat="money">💰 金融</button>
        <button class="chip" data-cat="medical">💊 医療・介護</button>
        <button class="chip" data-cat="lang">🗣️ 語学</button>
        <button class="chip" data-cat="beauty">💄 美容</button>
        <button class="chip" data-cat="story">📔 物語</button>
      </div>
      <span class="count"><strong id="article-count">0</strong> 件の記事</span>
    </div>

    <div class="sort-row">
      <span>並び：</span>
      <span class="pill is-active" data-sort="new">新着順</span>
      <span class="pill" data-sort="popular">人気順</span>
      <span class="pill" data-sort="short">読了が短い順</span>
    </div>

    <div class="article-grid" id="grid"></div>

  </div>
</section>

<div id="footer-slot"></div>

<script src="partials.js"></script>
<script>
  SL.mountHeader('articles');
  SL.mountFooter();

  // ===== Articles dynamic rendering from articles.json =====
  let allArticles = [];
  let currentCat = 'all';
  let currentSort = 'new';

  async function loadArticles() {
    try {
      const res = await fetch('articles.json');
      allArticles = await res.json();
      render();
    } catch (e) {
      console.error('articles.json 読み込み失敗', e);
      document.getElementById('grid').innerHTML = '<p style="grid-column:1/-1; text-align:center; color:var(--soft); padding:40px;">記事の読み込みに失敗しました。</p>';
    }
  }

  function render() {
    let list = [...allArticles];
    if (currentCat !== 'all') list = list.filter(a => a.category === currentCat);
    if (currentSort === 'new') list.sort((a, b) => b.date.localeCompare(a.date));
    else if (currentSort === 'popular') list.sort((a, b) => (a.popular_rank || 999) - (b.popular_rank || 999));
    else if (currentSort === 'short') list.sort((a, b) => a.read_minutes - b.read_minutes);

    const grid = document.getElementById('grid');
    if (list.length === 0) {
      grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:var(--soft); padding:40px;">このカテゴリの記事はまだありません。</p>';
    } else {
      grid.innerHTML = list.map(a => {
        const hasImg = !!a.thumb_image;
        const thumbStyle = hasImg ? `style="background-image:url('${a.thumb_image}')"` : '';
        const thumbContent = hasImg ? '' : a.icon;
        const thumbClass = `thumb ${a.thumb_color}${hasImg ? ' has-image' : ''}`;
        return `
        <a class="article-card card" data-cat="${a.category}" href="article-${a.slug}.html">
          <div class="${thumbClass}" ${thumbStyle}>${thumbContent}<span class="cat-pill cat-${a.category} badge">${a.category_label}</span></div>
          <div class="body">
            <h3>${a.title}</h3>
            <p class="excerpt">${a.excerpt}</p>
            <div class="meta"><span>${a.date.replace(/-/g, '.')}</span><span class="dot"></span><span>読了 ${a.read_minutes}分</span></div>
          </div>
        </a>
      `;}).join('');
    }
    document.getElementById('article-count').textContent = list.length;
  }

  document.querySelectorAll('#chips .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('#chips .chip').forEach(c => c.classList.remove('is-active'));
      chip.classList.add('is-active');
      currentCat = chip.dataset.cat;
      render();
    });
  });

  document.querySelectorAll('.sort-row .pill').forEach(pill => {
    pill.addEventListener('click', () => {
      document.querySelectorAll('.sort-row .pill').forEach(p => p.classList.remove('is-active'));
      pill.classList.add('is-active');
      currentSort = pill.dataset.sort;
      render();
    });
  });

  loadArticles();
</script>
</body>
</html>
